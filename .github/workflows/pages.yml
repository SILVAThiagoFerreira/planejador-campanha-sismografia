name: Publicar planejador
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: |
          mkdir _site
          cp index.html styles.css app.js config.json .nojekyll _site/
          cp -r src assets vendor data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # O deploy lista o artefato github-pages logo após o upload; sem essa espera, a listagem
      # pode não tê-lo ainda e o deploy falha com "Found 0 artifact(s)" (visto em 2026-11-24).
      - run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deployment
